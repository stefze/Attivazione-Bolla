# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: bolla-dr-replication

# azd does not support PowerShell language packaging for Azure Functions.
# Infrastructure is provisioned via `azd provision`.
# Function code is deployed via the postprovision hook using az functionapp deployment.

hooks:
  preprovision:
    shell: pwsh
    run: |
      if (-not $env:USER_ASSIGNED_IDENTITY_ID) {
        $id = Read-Host "Enter the Resource ID of the pre-existing user-assigned managed identity`n(format: /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>)"
        if (-not $id) { Write-Error "USER_ASSIGNED_IDENTITY_ID is required."; exit 1 }
        azd env set USER_ASSIGNED_IDENTITY_ID $id
      }

  postprovision:
    shell: pwsh
    run: |
      Set-Location ./DRReplication
      func azure functionapp publish $env:AZURE_FUNCTION_NAME --powershell

services: {}

